name: Release

on:
  push:
    tags: ["v*.*"]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "stable"
  EXPORT_PRESET: "Windows Desktop"
  ARTIFACT_NAME: last-year-of-our-lives-windows

jobs:
  release:
    name: Export and package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}"
          name="Godot_v${GODOT_VERSION}-${GODOT_RELEASE}"
          curl -fL -o godot.zip "${base}/${name}_linux.x86_64.zip"
          curl -fL -o templates.tpz "${base}/${name}_export_templates.tpz"
          unzip -q godot.zip
          sudo install -m 755 "${name}_linux.x86_64" /usr/local/bin/godot
          unzip -q templates.tpz
          template_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p "$template_dir"
          mv templates/* "$template_dir/"

      # The godot MCP bridge is a local editor convenience living in the
      # gitignored addons/ folder, so it is absent on a clean checkout. Strip both
      # references from the project file: the _mcp_game_helper autoload would
      # otherwise be baked into the export and fail at game startup. The final grep
      # fails the job loudly if these patterns ever stop matching.
      - name: Strip editor-only godot_ai integration
        run: |
          sed -i '/^_mcp_game_helper=/d' project.godot
          sed -i 's|^enabled=PackedStringArray(.*)$|enabled=PackedStringArray()|' project.godot
          ! grep -n "addons/godot_ai" project.godot

      # Exporting a Windows build from Linux needs rcedit (a Windows exe run under
      # wine) to stamp the icon and version fields. Nothing to stamp here, so turn
      # it off rather than installing wine.
      - name: Disable Windows resource stamping
        run: sed -i 's|^application/modify_resources=true$|application/modify_resources=false|' export_presets.cfg

      - name: Import resources
        run: godot --headless --import

      - name: Export ${{ env.EXPORT_PRESET }}
        run: |
          mkdir -p release
          godot --headless --export-release "$EXPORT_PRESET" release/release.exe

      - name: Zip release/
        run: |
          cd release
          zip -r "../${ARTIFACT_NAME}-${GITHUB_REF_NAME}.zip" .

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: "*.zip"
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
